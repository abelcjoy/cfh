<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hardware Codex</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --card: #141414;
            --text: #e0e0e0;
            --accent: #00ff9d;
            /* Matrix Green */
            --locked: #333;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }

        .card {
            background: var(--card);
            border: 1px solid #333;
            padding: 20px;
            border-radius: 8px;
            transition: transform 0.2s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
        }

        .card.locked {
            opacity: 0.5;
            border-style: dashed;
        }

        .icon {
            font-size: 2em;
            margin-bottom: 10px;
            display: block;
        }

        .title {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--accent);
        }

        .desc {
            font-size: 0.9em;
            color: #888;
            margin-bottom: 15px;
        }

        .progress-bar {
            height: 4px;
            background: #333;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
        }

        /* Modal for Quests */
        #modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 100;
            overflow-y: auto;
        }

        .modal-content {
            max-width: 800px;
            margin: 50px auto;
            background: var(--card);
            padding: 40px;
            border: 1px solid var(--accent);
        }

        .quest-item {
            border-bottom: 1px solid #333;
            padding: 15px 0;
            display: flex;
            align-items: center;
        }

        .quest-item:last-child {
            border-bottom: none;
        }

        .quest-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid var(--accent);
            margin-right: 20px;
            cursor: pointer;
        }

        .quest-checkbox.checked {
            background: var(--accent);
        }

        .quest-details h3 {
            margin: 0 0 5px 0;
            font-size: 1em;
        }

        .search-link {
            color: #888;
            text-decoration: none;
            font-size: 0.8em;
            border: 1px solid #333;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .search-link:hover {
            color: var(--accent);
            border-color: var(--accent);
        }

        .close-btn {
            float: right;
            cursor: pointer;
            color: #888;
            font-size: 1.5em;
        }
    </style>
</head>

<body>

    <h1>The Codex <span style="font-size:0.5em; color:#666">v1.0</span></h1>
    <div style="text-align: center; color: #666; max-width: 600px; margin: 0 auto;">
        "The future belongs to the formidable. Those who can build, and those who can repair."
    </div>

    <div class="grid" id="grid">
        <!-- Cards will be injected here JS -->
    </div>

    <div id="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modal-title" style="color: var(--accent)"></h2>
            <div id="gear-list"
                style="margin-bottom: 30px; padding: 15px; background: #222; border-left: 3px solid var(--accent);">
                <strong>REQUIRED GEAR:</strong> <span id="gear-text"></span>
            </div>
            <div id="quest-list"></div>
        </div>
    </div>

    <script src="data.js"></script>
    <script>
        const grid = document.getElementById('grid');
        const modal = document.getElementById('modal');

        // Render Grid
        hardwareCurriculum.forEach(item => {
            const card = document.createElement('div');
            card.className = `card ${item.locked ? 'locked' : ''}`;
            card.onclick = () => !item.locked && openModal(item);

            // Calculate progress (mock data for now)
            const progress = 0;

            card.innerHTML = `
                <span class="icon">${item.icon}</span>
                <div class="title">${item.title}</div>
                <div class="desc">${item.description || "Project currently locked."}</div>
                ${!item.locked ? `<div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>` : ''}
            `;
            grid.appendChild(card);
        });

        function openModal(item) {
            document.getElementById('modal-title').innerText = item.title;
            document.getElementById('gear-text').innerText = item.gear_required.join(", ");

            const list = document.getElementById('quest-list');
            list.innerHTML = '';

            item.quests.forEach((q, index) => {
                const div = document.createElement('div');
                div.className = 'quest-item';
                div.innerHTML = `
                    <div class="quest-checkbox" onclick="this.classList.toggle('checked')"></div>
                    <div class="quest-details">
                        <h3>LEVEL ${q.level}: ${q.title}</h3>
                        <p style="color: #888; font-size: 0.9em; margin: 5px 0;">MISSION: ${q.task}</p>
                        <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(q.search_term)}" target="_blank" class="search-link">
                            SEARCH: "${q.search_term}"
                        </a>
                    </div>
                `;
                list.appendChild(div);
            });

            modal.style.display = 'block';
        }

        function closeModal() {
            modal.style.display = 'none';
        }
    </script>
</body>

</html>
